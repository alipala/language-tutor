<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 375 375" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="187.5" cy="187.5" r="187.5"/>
    </clipPath>
  </defs>
  
  <!-- Background circle -->
  <circle cx="187.5" cy="187.5" r="187.5" fill="#4ecfbf"/>
  
  <!-- Bear face (simplified for favicon) -->
  <g clip-path="url(#circle-clip)">
    <!-- Bear head circle -->
    <circle cx="187.5" cy="187.5" r="120" fill="#f7f8fa"/>
    
    <!-- Bear ears -->
    <circle cx="140" cy="120" r="25" fill="#4ecfbf"/>
    <circle cx="235" cy="120" r="25" fill="#4ecfbf"/>
    
    <!-- Bear eyes -->
    <circle cx="160" cy="170" r="8" fill="#333"/>
    <circle cx="215" cy="170" r="8" fill="#333"/>
    
    <!-- Bear nose -->
    <ellipse cx="187.5" cy="200" rx="6" ry="4" fill="#333"/>
    
    <!-- Bear mouth -->
    <path d="M 175 220 Q 187.5 230 200 220" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Red dots (simplified) -->
    <circle cx="235" cy="120" r="4" fill="#f75a5a"/>
  </g>
</svg>
