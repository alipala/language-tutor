name: Duration Tracking Monitoring

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  monitor-duration-tracking:
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger Railway Monitoring
      run: |
        # Call Railway deployment to run monitoring
        # This will trigger the scheduled_monitoring.py script
        curl -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
          -d '{"command": "python3 backend/scheduled_monitoring.py"}' \
          https://api.railway.app/v1/projects/${{ secrets.RAILWAY_PROJECT_ID }}/services/${{ secrets.RAILWAY_SERVICE_ID }}/deployments/trigger
        
    - name: Log Monitoring Execution
      run: |
        echo "Duration tracking monitoring triggered at $(date)"
        echo "This will run the daily health check and send Slack alerts if issues are found"
