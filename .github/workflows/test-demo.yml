name: Test Demo - API Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run'
        required: false
        default: 'quick'
        type: choice
        options:
        - quick
        - auth
        - learning
        - stripe
        - progress
        - all
      show_logs:
        description: 'Show detailed logs'
        required: false
        default: true
        type: boolean

jobs:
  demo-tests:
    name: Demo API Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        # Install only if requirements files exist
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "⚠️ requirements.txt not found, installing basic dependencies"
          pip install fastapi uvicorn motor pytest pytest-asyncio httpx
        fi
        
        if [ -f tests/requirements.txt ]; then
          pip install -r tests/requirements.txt
        else
          echo "⚠️ tests/requirements.txt not found, installing basic test dependencies"
          pip install pytest pytest-asyncio httpx pytest-cov
        fi

    - name: Wait for MongoDB
      run: |
        timeout 60 bash -c 'until mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 1; done'
        echo "✅ MongoDB is ready"

    - name: Set up test environment
      run: |
        echo "ENVIRONMENT=test" >> $GITHUB_ENV
        echo "DATABASE_NAME=language_tutor_test_demo" >> $GITHUB_ENV
        echo "TEST_MONGODB_URL=mongodb://localhost:27017" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test_openai_key" >> $GITHUB_ENV
        echo "STRIPE_SECRET_KEY=sk_test_123" >> $GITHUB_ENV
        echo "JWT_SECRET_KEY=test_jwt_secret_key_for_testing_only" >> $GITHUB_ENV

    - name: Check test files availability
      working-directory: backend
      run: |
        echo "🔍 Checking for test files..."
        
        if [ -d "tests/integration" ]; then
          echo "✅ Integration tests directory found"
          ls -la tests/integration/
        else
          echo "❌ Integration tests directory not found"
          echo "📁 Available directories:"
          find . -name "test*" -type d 2>/dev/null || echo "No test directories found"
          echo "📄 Available test files:"
          find . -name "test*.py" 2>/dev/null || echo "No test files found"
        fi

    - name: Run basic API validation
      working-directory: backend
      run: |
        echo "🧪 Running basic API validation..."
        
        # Check if main.py exists and can be imported
        if [ -f "main.py" ]; then
          echo "✅ main.py found"
          python -c "import sys; sys.path.append('.'); from main import app; print('✅ FastAPI app imported successfully'); print(f'📊 App routes: {len(app.routes)} routes found')" || echo "❌ Error importing app"
        else
          echo "❌ main.py not found"
          ls -la
        fi

    - name: Run integration tests (if available)
      working-directory: backend
      run: |
        TEST_CATEGORY="${{ github.event.inputs.test_category || 'quick' }}"
        echo "🎯 Test Category: $TEST_CATEGORY"
        
        if [ -d "tests/integration" ]; then
          echo "🧪 Running integration tests..."
          
          case $TEST_CATEGORY in
            "auth")
              if [ -f "tests/integration/test_auth_routes.py" ]; then
                python -m pytest tests/integration/test_auth_routes.py -v --tb=short
              else
                echo "❌ Authentication tests not found"
              fi
              ;;
            "learning")
              if [ -f "tests/integration/test_learning_routes.py" ]; then
                python -m pytest tests/integration/test_learning_routes.py -v --tb=short
              else
                echo "❌ Learning tests not found"
              fi
              ;;
            "stripe")
              if [ -f "tests/integration/test_stripe_routes.py" ]; then
                python -m pytest tests/integration/test_stripe_routes.py -v --tb=short
              else
                echo "❌ Stripe tests not found"
              fi
              ;;
            "progress")
              if [ -f "tests/integration/test_progress_routes.py" ]; then
                python -m pytest tests/integration/test_progress_routes.py -v --tb=short
              else
                echo "❌ Progress tests not found"
              fi
              ;;
            "quick")
              echo "⚡ Running quick smoke tests..."
              if [ -f "tests/integration/test_auth_routes.py" ]; then
                python -m pytest tests/integration/ -k "test_register_new_user_success or test_get_learning_goals or test_get_subscription_plans" -v --tb=short || echo "Some quick tests failed"
              else
                echo "❌ No integration tests available for quick run"
              fi
              ;;
            "all")
              echo "🧪 Running all integration tests..."
              python -m pytest tests/integration/ -v --tb=short
              ;;
          esac
        else
          echo "❌ No integration tests directory found"
          echo "💡 This demo shows what would happen when tests are available"
          
          # Simulate test results
          echo "🎭 Simulating test results for demonstration:"
          echo "✅ test_register_new_user_success - PASSED"
          echo "✅ test_get_learning_goals - PASSED"
          echo "✅ test_get_subscription_plans - PASSED"
          echo "✅ test_get_progress_stats_empty - PASSED"
          echo ""
          echo "📊 Simulated Results: 4 passed, 0 failed"
        fi

    - name: Generate test summary
      if: always()
      run: |
        echo "# 🧪 API Integration Test Demo Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Test Category:** ${{ github.event.inputs.test_category || 'quick' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "backend/tests/integration" ]; then
          echo "✅ **Integration tests are available and ready to run!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Available Test Modules" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Authentication Tests (test_auth_routes.py)" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 Learning Routes Tests (test_learning_routes.py)" >> $GITHUB_STEP_SUMMARY
          echo "- 💳 Stripe/Subscription Tests (test_stripe_routes.py)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Progress Tracking Tests (test_progress_routes.py)" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Integration tests not yet available on this branch**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Merge the feature branch with comprehensive tests" >> $GITHUB_STEP_SUMMARY
          echo "2. Tests will automatically run on all future PRs" >> $GITHUB_STEP_SUMMARY
          echo "3. Manual triggers will be available with full test suite" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Manual Trigger Options" >> $GITHUB_STEP_SUMMARY
        echo "- **quick**: Fast smoke tests (recommended for demos)" >> $GITHUB_STEP_SUMMARY
        echo "- **auth**: Authentication and security tests" >> $GITHUB_STEP_SUMMARY
        echo "- **learning**: Learning plans and goals tests" >> $GITHUB_STEP_SUMMARY
        echo "- **stripe**: Payment and subscription tests" >> $GITHUB_STEP_SUMMARY
        echo "- **progress**: Progress tracking and analytics tests" >> $GITHUB_STEP_SUMMARY
        echo "- **all**: Complete test suite with coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*This demo workflow shows the testing capabilities. Full tests available after merging the feature branch.*" >> $GITHUB_STEP_SUMMARY

    - name: Show next steps
      run: |
        echo "🎉 Demo completed!"
        echo ""
        echo "📋 Next Steps:"
        echo "1. Create a Pull Request from 'feature/api-integration-tests' to 'main'"
        echo "2. The full test suite will run automatically on the PR"
        echo "3. After merging, all future PRs will be protected by these tests"
        echo "4. Manual triggers will be available with comprehensive options"
        echo ""
        echo "🔗 Create PR: https://github.com/alipala/language-tutor/pull/new/feature/api-integration-tests"
