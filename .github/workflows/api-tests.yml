name: API Integration Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - auth
        - learning
        - stripe
        - progress
        - quick
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '70'
        type: string
      run_security_scan:
        description: 'Run security scans'
        required: false
        default: true
        type: boolean
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  MONGODB_VERSION: '6.0'

jobs:
  api-tests:
    name: FastAPI Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/tests/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install Python dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Wait for MongoDB to be ready
      run: |
        timeout 60 bash -c 'until mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 1; done'

    - name: Set up test environment variables
      run: |
        echo "ENVIRONMENT=test" >> $GITHUB_ENV
        echo "DATABASE_NAME=language_tutor_test" >> $GITHUB_ENV
        echo "TEST_MONGODB_URL=mongodb://localhost:27017" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test_openai_key" >> $GITHUB_ENV
        echo "STRIPE_SECRET_KEY=sk_test_123" >> $GITHUB_ENV
        echo "STRIPE_WEBHOOK_SECRET=whsec_test_123" >> $GITHUB_ENV
        echo "JWT_SECRET_KEY=test_jwt_secret_key_for_testing_only" >> $GITHUB_ENV
        echo "EMAIL_HOST=localhost" >> $GITHUB_ENV
        echo "EMAIL_PORT=587" >> $GITHUB_ENV
        echo "EMAIL_USERNAME=test@example.com" >> $GITHUB_ENV
        echo "EMAIL_PASSWORD=test_password" >> $GITHUB_ENV

    - name: Run linting with flake8
      working-directory: backend
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run type checking with mypy
      working-directory: backend
      run: |
        pip install mypy types-requests
        mypy . --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Run security checks with bandit
      working-directory: backend
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -ll
      continue-on-error: true

    - name: Determine test category and coverage threshold
      id: test-config
      run: |
        TEST_CATEGORY="${{ github.event.inputs.test_category || 'all' }}"
        COVERAGE_THRESHOLD="${{ github.event.inputs.coverage_threshold || '70' }}"
        echo "test_category=$TEST_CATEGORY" >> $GITHUB_OUTPUT
        echo "coverage_threshold=$COVERAGE_THRESHOLD" >> $GITHUB_OUTPUT
        echo "🎯 Test Category: $TEST_CATEGORY"
        echo "📊 Coverage Threshold: $COVERAGE_THRESHOLD%"

    - name: Run integration tests with coverage
      working-directory: backend
      run: |
        TEST_CATEGORY="${{ steps.test-config.outputs.test_category }}"
        COVERAGE_THRESHOLD="${{ steps.test-config.outputs.coverage_threshold }}"
        
        # Determine test path based on category
        case $TEST_CATEGORY in
          "auth")
            TEST_PATH="tests/integration/test_auth_routes.py"
            echo "🔐 Running Authentication Tests Only"
            ;;
          "learning")
            TEST_PATH="tests/integration/test_learning_routes.py"
            echo "📚 Running Learning Routes Tests Only"
            ;;
          "stripe")
            TEST_PATH="tests/integration/test_stripe_routes.py"
            echo "💳 Running Stripe/Subscription Tests Only"
            ;;
          "progress")
            TEST_PATH="tests/integration/test_progress_routes.py"
            echo "📊 Running Progress Tracking Tests Only"
            ;;
          "quick")
            TEST_PATH="tests/integration/"
            QUICK_FILTER="-k 'test_get_learning_goals or test_register_new_user_success or test_get_subscription_plans or test_get_progress_stats_empty'"
            echo "⚡ Running Quick Smoke Tests"
            ;;
          *)
            TEST_PATH="tests/integration/"
            echo "🧪 Running All Integration Tests"
            ;;
        esac
        
        # Build pytest command
        PYTEST_CMD="python -m pytest $TEST_PATH \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=$COVERAGE_THRESHOLD \
          --junitxml=test-results.xml \
          --html=test-report.html \
          --self-contained-html \
          -v \
          --tb=short \
          --maxfail=10 \
          --durations=10"
        
        # Add quick filter if needed
        if [ ! -z "$QUICK_FILTER" ]; then
          PYTEST_CMD="$PYTEST_CMD $QUICK_FILTER"
        fi
        
        echo "Executing: $PYTEST_CMD"
        eval $PYTEST_CMD

    - name: Run additional test validation
      working-directory: backend
      if: steps.test-config.outputs.test_category == 'all'
      run: |
        echo "🔍 Running additional validation for comprehensive test run..."
        
        echo "✅ Authentication Tests:"
        python -m pytest tests/integration/test_auth_routes.py::TestUserRegistration::test_register_new_user_success -v
        
        echo "✅ Learning Tests:"
        python -m pytest tests/integration/test_learning_routes.py::TestLearningGoals::test_get_learning_goals -v
        
        echo "✅ Stripe Tests:"
        python -m pytest tests/integration/test_stripe_routes.py::TestSubscriptionStatus::test_get_subscription_plans -v
        
        echo "✅ Progress Tests:"
        python -m pytest tests/integration/test_progress_routes.py::TestProgressStats::test_get_progress_stats_empty -v

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          backend/test-results.xml
          backend/test-report.html
          backend/htmlcov/
          backend/bandit-report.json

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: backend/coverage.xml
        directory: backend/
        flags: backend,integration
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Comment PR with test results
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let comment = '## 🧪 API Integration Test Results\n\n';
          
          try {
            // Read test results if available
            const testResultsPath = path.join('backend', 'test-results.xml');
            if (fs.existsSync(testResultsPath)) {
              comment += '✅ Integration tests completed successfully!\n\n';
            } else {
              comment += '❌ Integration tests failed or did not complete.\n\n';
            }
            
            comment += '### Test Coverage\n';
            comment += 'Coverage report has been generated and uploaded as an artifact.\n\n';
            
            comment += '### Security Scan\n';
            comment += 'Security scan with bandit has been completed.\n\n';
            
            comment += '### Next Steps\n';
            comment += '- Review the test report artifact for detailed results\n';
            comment += '- Check coverage report to ensure adequate test coverage\n';
            comment += '- Address any security issues found by bandit\n';
            
          } catch (error) {
            comment += '⚠️ Could not read test results. Please check the workflow logs.\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        mongodb-version: ['5.0', '6.0', '7.0']
      fail-fast: false
    
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Wait for MongoDB
      run: |
        timeout 60 bash -c 'until mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 1; done'

    - name: Run core tests
      working-directory: backend
      env:
        ENVIRONMENT: test
        TEST_MONGODB_URL: mongodb://localhost:27017
        DATABASE_NAME: language_tutor_test_${{ matrix.python-version }}_${{ matrix.mongodb-version }}
      run: |
        python -m pytest tests/integration/test_auth_routes.py::TestUserRegistration::test_register_new_user_success -v
        python -m pytest tests/integration/test_learning_routes.py::TestLearningGoals::test_get_learning_goals -v
        python -m pytest tests/integration/test_stripe_routes.py::TestSubscriptionStatus::test_get_subscription_plans -v

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Run performance benchmarks
      working-directory: backend
      env:
        ENVIRONMENT: test
        TEST_MONGODB_URL: mongodb://localhost:27017
      run: |
        python -m pytest tests/integration/ \
          --benchmark-only \
          --benchmark-json=benchmark-results.json \
          --benchmark-sort=mean \
          --benchmark-min-rounds=5
      continue-on-error: true

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: backend/benchmark-results.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep

    - name: Run bandit security scan
      working-directory: backend
      run: |
        bandit -r . -f json -o bandit-report.json
        bandit -r . -ll
      continue-on-error: true

    - name: Run safety check for dependencies
      working-directory: backend
      run: |
        safety check --json --output safety-report.json
        safety check
      continue-on-error: true

    - name: Run semgrep scan
      run: |
        semgrep --config=auto backend/ --json --output=semgrep-report.json
        semgrep --config=auto backend/
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          backend/safety-report.json
          semgrep-report.json

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests]
    if: always()
    
    steps:
    - name: Download test artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: test-results/

    - name: Generate test summary
      run: |
        echo "# 🧪 API Integration Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.api-tests.result }}" == "success" ]; then
          echo "✅ **All integration tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some integration tests failed.**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Authentication routes: ✅ Comprehensive coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Learning routes: ✅ Comprehensive coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Stripe/subscription routes: ✅ Comprehensive coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Progress tracking routes: ✅ Comprehensive coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Categories" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: Core business logic validation" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: API endpoint functionality" >> $GITHUB_STEP_SUMMARY
        echo "- **Authentication Tests**: Security and access control" >> $GITHUB_STEP_SUMMARY
        echo "- **Database Tests**: Data persistence and retrieval" >> $GITHUB_STEP_SUMMARY
        echo "- **External API Tests**: Third-party service integration (mocked)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        echo "- Test results (JUnit XML)" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage report (HTML)" >> $GITHUB_STEP_SUMMARY
        echo "- Security scan results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*This summary was generated automatically by the API Integration Tests workflow.*" >> $GITHUB_STEP_SUMMARY
