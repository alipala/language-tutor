[build]
builder = "nixpacks"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.environmentVariables]]
name = "RAILWAY_HEALTHCHECK_PORT"
value = "8000"

[[deploy.environmentVariables]]
name = "BACKEND_URL"
value = "http://localhost:8000"

[nixpacks]
nodejs-version = "20"
python-version = "3.11"
