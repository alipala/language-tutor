[build]
builder = "nixpacks"

[deploy]
startCommand = "/app/start.sh"
# Healthcheck is set per-service in the Railway dashboard (web → /api/health,
# crons → none). railway.toml MUST NOT pin a path here: a single `/`
# healthcheck made every cron deploy time out (the cron containers don't run
# an HTTP server) which forced Railway to keep rolling back to the last
# successful image — which on news meant 1-month-stale code that capped
# generation at 5 articles instead of the multi-provider 120.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.environmentVariables]]
name = "RAILWAY_HEALTHCHECK_PORT"
value = "8000"

# BACKEND_URL is not set for production - Next.js will use same-origin for API calls

[nixpacks]
nodejs-version = "20"
python-version = "3.11"
