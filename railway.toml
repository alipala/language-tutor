[build]
builder = "nixpacks"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.environmentVariables]]
name = "RAILWAY_HEALTHCHECK_PORT"
value = "8000"

# BACKEND_URL is not set for production - Next.js will use same-origin for API calls

[nixpacks]
nodejs-version = "20"
python-version = "3.11"
