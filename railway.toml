[build]
builder = "nixpacks"

[deploy]
workdir = "backend"
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-3001}"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[nixpacks]
nodejs-version = "20"
python-version = "3.11.9"
