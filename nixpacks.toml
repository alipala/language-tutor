[phases.setup]
npmVersion = "10"
nodeVersion = "20"
pythonVersion = "3.11"
aptPkgs = [
  "python3-pip", 
  "python3-dev", 
  "python3-venv",
  "build-essential",
  "pkg-config",
  # WeasyPrint system dependencies
  "libpango-1.0-0",
  "libpangoft2-1.0-0", 
  "libpangocairo-1.0-0",
  "libgdk-pixbuf2.0-0",
  "libgdk-pixbuf2.0-dev",
  "libffi-dev",
  "shared-mime-info",
  "libcairo2",
  "libcairo2-dev",
  "libcairo-gobject2",
  "libglib2.0-0",
  "libglib2.0-dev",
  "libgtk-3-0",
  "libgtk-3-dev",
  "fontconfig",
  "fonts-dejavu-core",
  "libxml2-dev",
  "libxslt1-dev",
  "zlib1g-dev",
  "libjpeg-dev",
  "libfreetype6-dev",
  "liblcms2-dev",
  "libwebp-dev",
  "tcl8.6-dev",
  "tk8.6-dev"
]

[phases.install]
cmds = [
  "npm --prefix ./frontend install",
  "python3 -m pip install --no-cache-dir --upgrade pip==24.0",
  "python3 -m pip install --no-cache-dir setuptools==69.5.1 wheel==0.43.0",
  "python3 -m pip install --no-cache-dir -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "npm --prefix ./frontend run build",
  "mkdir -p ./frontend/out",
  "ls -la ./frontend/.next || echo '.next directory not found'",
  "ls -la ./frontend/out || echo 'out directory not found'"
]

[start]
cwd = "backend"
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-3001}"
