[phases.setup]
pythonVersion = "3.11"
# Nix-provided python3 doesn't include pip; bootstrap it via ensurepip
# before requirements install, otherwise `python3 -m pip` fails with
# "No module named pip" (this was breaking cron service builds for a
# month, causing Railway to roll back to the last known-good image).
aptPkgs = ["python3-dev", "python3-venv", "build-essential"]

[phases.install]
cmd = "python3 -m ensurepip --upgrade && python3 -m pip install --no-cache-dir -r requirements.txt"

[start]
cmd = "/opt/venv/bin/python challenge_pool_replenisher.py"
