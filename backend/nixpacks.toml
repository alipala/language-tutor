[phases.setup]
pythonVersion = "3.11"
aptPkgs = ["python3-pip", "python3-dev", "build-essential"]

[phases.install]
cmds = [
  "python3 -m pip install --no-cache-dir --upgrade pip==24.0",
  "python3 -m pip install --no-cache-dir setuptools==69.5.1 wheel==0.43.0",
  "python3 -m pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = "python challenge_pool_replenisher.py"
