[phases.setup]
pythonVersion = "3.11"
# Nix-provided python3 doesn't include pip. Bootstrap pip into the
# nix python via ensurepip during the setup phase. `cmds` runs AFTER
# the nix packages are installed, so python3 is available here.
# Once pip is present, the default Python provider install phase
# (`python3 -m pip install -r requirements.txt`) succeeds.
#
# Why this matters: without this, every cron service build (news,
# scheduler, run_daily_digest) failed with "No module named pip",
# Railway rolled back to a 1-month-old image, and the news cron kept
# producing 5 articles instead of the multi-provider catalog's ~120.
aptPkgs = ["python3-dev", "python3-venv", "build-essential"]
cmds = ["python3 -m ensurepip --upgrade && python3 -m pip install --upgrade pip"]

[start]
cmd = "/opt/venv/bin/python challenge_pool_replenisher.py"
